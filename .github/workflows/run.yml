name: Claude 5h Warmup

on:
  push:
    branches: [main]
  workflow_dispatch:
  repository_dispatch:
    types: [job_trigger]

jobs:
  claude_warmup:
    runs-on: ubuntu-latest

    steps:
      - name: Kiểm tra biến môi trường và Secret
        env:
          CLAUDE_OAUTH_TOKEN: ${{ secrets.CLAUDE_OAUTH_TOKEN }}
        run: |
          if [ -z "$CLAUDE_OAUTH_TOKEN" ]; then
            echo "Lỗi: Không tìm thấy CLAUDE_OAUTH_TOKEN!"
            exit 1
          else
            echo "Đã nạp thành công CLAUDE_OAUTH_TOKEN!"
            echo "Độ dài token: ${#CLAUDE_OAUTH_TOKEN} ký tự"
          fi

      - name: Fetch Usage via CLI OAuth Endpoint
        env:
          OAUTH_TOKEN: ${{ secrets.CLAUDE_OAUTH_TOKEN }}
        run: |
          RESPONSE=$(curl -s -w "\n%{http_code}" \
            -H "Authorization: Bearer $OAUTH_TOKEN" \
            -H "anthropic-beta: oauth-2025-04-20" \
            -H "User-Agent: claude-code/1.0.0" \
            -H "Accept: application/json" \
            "https://api.anthropic.com/api/oauth/usage")

          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | sed '$d')

          echo "HTTP Status: $HTTP_CODE"
          if [ "$HTTP_CODE" -eq 200 ]; then
            echo "$BODY" | jq .
          else
            echo "Lỗi gọi API OAuth:"
            echo "$BODY"
            exit 1
          fi

      - name: Trigger Claude 5h Window
        timeout-minutes: 3
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_OAUTH_TOKEN }}
        run: |
          npx -y @anthropic-ai/claude-code --version

          for i in 1 2 3; do
            echo "Attempt $i..."
            if npx -y @anthropic-ai/claude-code --model haiku -p "Reply with 1"; then
              echo "Warmup successful!"
              exit 0
            fi
            sleep 30
          done
          exit 1

      - name: Fetch Usage via CLI OAuth Endpoint
        env:
          OAUTH_TOKEN: ${{ secrets.CLAUDE_OAUTH_TOKEN }}
        run: |
          RESPONSE=$(curl -s -w "\n%{http_code}" \
            -H "Authorization: Bearer $OAUTH_TOKEN" \
            -H "anthropic-beta: oauth-2025-04-20" \
            -H "User-Agent: claude-code/1.0.0" \
            -H "Accept: application/json" \
            "https://api.anthropic.com/api/oauth/usage")

          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | sed '$d')

          echo "HTTP Status: $HTTP_CODE"
          if [ "$HTTP_CODE" -eq 200 ]; then
            echo "$BODY" | jq .
          else
            echo "Lỗi gọi API OAuth:"
            echo "$BODY"
            exit 1
          fi
