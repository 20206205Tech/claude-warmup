name: CI Demo với Secrets

# Kích hoạt khi có code push lên nhánh main hoặc chạy thủ công
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      # Bước 1: Lấy mã nguồn từ repo về máy ảo runner
      - name: Checkout code
        uses: actions/checkout@v4

      # Bước 2: Sử dụng Secret đã tạo ở Bước 2
      - name: Kiểm tra biến môi trường và Secret
        env:
          MY_SECRET_KEY: ${{ secrets.API_KEY }}
        run: |
          echo "Bắt đầu chạy tiến trình..."
          if [ -z "$MY_SECRET_KEY" ]; then
            echo "Lỗi: Không tìm thấy API_KEY!"
            exit 1
          else
            echo "Đã nạp thành công API_KEY!"
            # Lưu ý: GitHub tự động che (mask) giá trị secret bằng dấu *** nếu bạn cố tình echo nó ra log
            echo "Giá trị hiển thị trong log: $MY_SECRET_KEY"
          fi