name: Claude 5h Warmup

on:
  push:
    branches: [main]
  workflow_dispatch:
  repository_dispatch:
    types: [job_trigger]

jobs:
  claude_warmup:
    runs-on: ubuntu-latest

    steps:
      - name: Kiểm tra biến môi trường và Secret
        env:
          CLAUDE_OAUTH_TOKEN: ${{ secrets.CLAUDE_OAUTH_TOKEN }}
        run: |
          if [ -z "$CLAUDE_OAUTH_TOKEN" ]; then
            echo "Lỗi: Không tìm thấy CLAUDE_OAUTH_TOKEN!"
            exit 1
          else
            echo "Đã nạp thành công CLAUDE_OAUTH_TOKEN!"
            echo "Độ dài token: ${#CLAUDE_OAUTH_TOKEN} ký tự"
          fi

      - name: Trigger Claude 5h Window
        timeout-minutes: 3
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_OAUTH_TOKEN }}
        run: |
          npm install -g @anthropic-ai/claude-code
          claude --version

          # Thử tối đa 4 lần, thời gian nghỉ tăng dần: 5s, 15s, 30s
          DELAYS=(5 15 30 0)

          for i in 1 2 3 4; do
            echo "Attempt $i..."
            if timeout 30s claude --model haiku --max-turns 1 -p "Output only the character '1' and nothing else."; then
              echo "Warmup successful!"
              exit 0
            fi
            
            SLEEP_TIME=${DELAYS[$((i-1))]}
            if [ "$SLEEP_TIME" -gt 0 ]; then
              echo "Thất bại, nghỉ ${SLEEP_TIME}s trước khi thử lại..."
              sleep $SLEEP_TIME
            fi
          done

          echo "Warmup thất bại sau 4 lần thử."
          exit 1
