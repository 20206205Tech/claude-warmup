name: Check Claude Usage via CLI

on:
  push:
  workflow_dispatch:

jobs:
  cli-usage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Claude Code CLI & expect
        run: |
          sudo apt-get update && sudo apt-get install -y expect
          npm install -g @anthropic-ai/claude-code

      - name: Restore Credentials & Run /usage
        env:
          CLAUDE_CREDENTIALS_JSON: ${{ secrets.CLAUDE_OAUTH_TOKEN }}
        run: |
          # mkdir -p ~/.claude
          # echo "$CLAUDE_CREDENTIALS_JSON" > ~/.claude/.credentials.json
          # chmod 600 ~/.claude/.credentials.json

          expect -c '
            log_user 1
            set timeout 30
            spawn claude
            expect {
              "Yes, I trust this folder" { send "\r"; exp_continue }
              "Try" {}
              ">" {}
              timeout { exit 1 }
            }
            send "/usage\r"
            sleep 3
            send "\003"
            expect eof
          ' | sed 's/\x1b\[[0-9;]*[a-zA-Z]//g'