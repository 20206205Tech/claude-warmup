name: Check Claude Usage (Clean JSON)

on:
  push:
  workflow_dispatch:

jobs:
  check-usage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Claude Code CLI & expect
        run: |
          sudo apt-get update && sudo apt-get install -y expect
          npm install -g @anthropic-ai/claude-code

          mkdir -p ~/.claude
          cat << 'EOF' > ~/.claude.json
          {
            "hasCompletedOnboarding": true,
            "theme": "dark",
            "projects": {
              "/home/runner/work": {
                "hasTrustDialogAccepted": true
              }
            }
          }
          EOF

      - name: Intercept /usage JSON from Claude CLI
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_OAUTH_TOKEN }}
        run: |
          # Tạo file hook chặn hàm fetch của Node.js để bắt response từ endpoint usage
          cat << 'EOF' > /tmp/hook.js
          const fs = require('fs');
          const origFetch = global.fetch;
          global.fetch = async (...args) => {
            const url = typeof args[0] === 'string' ? args[0] : args[0]?.url || '';
            const res = await origFetch(...args);
            if (url.includes('usage')) {
              const clone = res.clone();
              const text = await clone.text();
              fs.writeFileSync('/tmp/usage_output.json', text);
            }
            return res;
          };
          EOF

          # Chạy claude với NODE_OPTIONS nạp file hook
          NODE_OPTIONS="--require /tmp/hook.js" expect -c '
            log_user 0
            set timeout 30
            spawn claude
            expect {
              "Choose the text style" { send "\r"; exp_continue }
              "Yes, I trust this folder" { send "\r"; exp_continue }
              "Try" {}
              ">" {}
              timeout { puts "\n[ERROR] Timeout"; exit 1 }
            }
            sleep 1
            send "/usage\r"
            sleep 4
            send "\003"
            sleep 1
            send "\003"
            expect eof
          '

          # Kiểm tra kết quả JSON thu được
          if [ -f /tmp/usage_output.json ]; then
            echo "=== RAW USAGE JSON ==="
            cat /tmp/usage_output.json | jq .
          else
            echo "Không bắt được dữ liệu usage!"
            exit 1
          fi