name: Check Claude Usage via CLI Interactive

on:
  push:
  workflow_dispatch:

jobs:
  cli-usage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Claude Code CLI & expect
        run: |
          sudo apt-get update && sudo apt-get install -y expect
          npm install -g @anthropic-ai/claude-code

      - name: Run /usage inside Claude CLI
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_OAUTH_TOKEN }}
        run: |
          expect -c '
            log_user 1
            set timeout 30
            spawn claude
            expect {
              "Try" {}
              ">" {}
              timeout { exit 1 }
            }
            send "/usage\r"
            sleep 3
            send "\003"
            expect eof
          ' | sed 's/\x1b\[[0-9;]*[a-zA-Z]//g'