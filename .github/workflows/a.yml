name: Check Claude Usage via CLI

on:
  push:
  workflow_dispatch:

jobs:
  cli-usage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Claude Code CLI & expect
        run: |
          sudo apt-get update && sudo apt-get install -y expect
          npm install -g @anthropic-ai/claude-code

      - name: Pre-configure Claude & Run /usage
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_OAUTH_TOKEN }}
        run: |
          # 1. Tạo sẵn config để bỏ qua màn hình chọn Theme và Trust Folder
          mkdir -p ~/.claude
          cat << 'EOF' > ~/.claude.json
          {
            "hasCompletedOnboarding": true,
            "theme": "dark",
            "projects": {
              "/home/runner/work": {
                "hasTrustDialogAccepted": true
              }
            }
          }
          EOF

          # 2. Chạy expect và xử lý nốt các prompt nếu còn sót
          expect -c '
            log_user 1
            set timeout 30
            spawn claude
            expect {
              "Choose the text style" { send "\r"; exp_continue }
              "Yes, I trust this folder" { send "\r"; exp_continue }
              "Try" {}
              ">" {}
              timeout { puts "\n[ERROR] Timeout waiting for Claude prompt"; exit 1 }
            }
            sleep 1
            send "/usage\r"
            sleep 4
            send "\003"
            sleep 1
            send "\003"
            expect eof
          ' | sed -E 's/\x1b\[[0-9;?]*[a-zA-Z]//g'