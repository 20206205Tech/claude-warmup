name: Check Claude Usage (Direct API)

on:
  push:
  workflow_dispatch:

jobs:
  check-usage:
    runs-on: ubuntu-latest


    


    steps:
      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true




    steps:
      - name: Fetch & Format Usage
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_OAUTH_TOKEN }}
        run: |
          uv run --with httpx --with rich python - << 'EOF'
          import os
          import httpx
          from rich.console import Console
          from rich.table import Table

          token = os.environ["CLAUDE_CODE_OAUTH_TOKEN"].strip()
          resp = httpx.get(
              "https://api.anthropic.com/api/oauth/usage",
              headers={
                  "Authorization": f"Bearer {token}",
                  "anthropic-beta": "oauth-2025-04-20",
                  "User-Agent": "claude-code/2.1.197",
              },
              timeout=15,
          )
          resp.raise_for_status()
          data = resp.json()

          table = Table(title="Claude Code Quota Usage")
          table.add_column("Window", style="cyan")
          table.add_column("Utilization", style="magenta")
          table.add_column("Resets At", style="green")

          for key, val in data.items():
              if isinstance(val, dict) and "utilization" in val:
                  table.add_row(
                      key,
                      f"{val.get('utilization')}%",
                      str(val.get("resets_at", "N/A")),
                  )

          Console().print(table)
          EOF